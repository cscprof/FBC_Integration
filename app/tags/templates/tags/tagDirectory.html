{% extends 'base.html' %}

{% block title %}Flourish Beaver County - Tag List{% endblock %}

{% block content %}

<section class="section">
    <div class="container">
        <h1 class="title has-text-centered">Tags List</h1>
        <p class="has-text-centered is-size-5 mb-5" style="color: #666; margin-top: 10px;">
            All your tags, all in one place!
        </p>
        <table style="margin: auto; color: #111111">
            <thead style="background-color: #4CAF50">
                <tr>
                    <td style="border: 1px solid #222222; padding: 5px">Tag ID</td>
                    <td style="border: 1px solid #222222; padding: 5px">Tag Name</td>
                    <td style="border: 1px solid #222222; padding: 5px">Tag Type</td>
                </tr>
            </thead>
            {% for row in tags%}
            <tr>
                <td style="border: 1px solid #222222; background-color: #8ac926; padding: 5px">{{row.tag_id}}</td>
                <td style="border: 1px solid #222222; padding: 5px">{{row.tag_name}}</td>
                <td style="border: 1px solid #222222; padding: 5px">{{row.tag_type}}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
const searchInput = document.querySelector(".searchinput");
const categorySelect = document.querySelector(".categoryselect");
const resourceBoxes = document.querySelectorAll(".exampleboxes");

function filterResources() {
const searchValue = searchInput.value.toLowerCase();
const selectedCategory = categorySelect.value;

resourceBoxes.forEach(box => {
const boxCategory = box.getAttribute("data-category");
const textContent = box.innerText.toLowerCase();

const matchesSearch = textContent.includes(searchValue);
const matchesCategory =
selectedCategory === "all" || boxCategory === selectedCategory;

if (matchesSearch && matchesCategory) {
box.style.display = "block";
} else {
box.style.display = "none";
}
});
}

searchInput.addEventListener("keyup", filterResources);
categorySelect.addEventListener("change", filterResources);
});
</script>
